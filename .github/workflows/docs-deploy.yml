name: Docs Site

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: [self-hosted, remember-ci]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check documentation truth and metadata
        run: python ../scripts/check_docs_truth.py

      # `next build` type-checks the project and generates .next/types, so a
      # separate pre-build `tsc` step is intentionally omitted (it would run
      # before those generated types exist).
      - name: Build static site (Next.js export + Pagefind index)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    # Only publish from main; PRs run the build job above as a check.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, remember-ci]
    # Serialize production deployments only, so PR build-checks stay concurrent.
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify docs origin hostname
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname=$(gh api "repos/${{ github.repository }}/pages" --jq .cname)
          if [ "$cname" != "docs.remember.dev" ]; then
            echo "::error::GitHub Pages must retain docs.remember.dev: remember.dev/docs proxies to this origin. Restore the Pages custom domain before deploying."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
