name: CI

# PR-oriented fast gate (target wall time under ~10 minutes). Full multi-Python
# coverage stays on the Nightly workflow. Design/rationale:
# design/operations/pr-ci-fast-gate.md

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
      surfaces: ${{ steps.filter.outputs.surfaces }}
      adapters: ${{ steps.filter.outputs.adapters }}
      compose: ${{ steps.filter.outputs.compose }}
      shared_core: ${{ steps.filter.outputs.shared_core }}
      ci_control: ${{ steps.filter.outputs.ci_control }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/ci/path-filters.yml

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13
      - name: Test inventory drift check
        run: python3 .github/ci/check_test_inventory.py
      - name: Architecture dependency check
        run: uv run lint-imports
      - name: Ruff lint
        run: uv run ruff check src/ benchmarks/
      - name: Ruff format check
        run: uv run ruff format --check src/ benchmarks/
      - name: Pyright type check
        run: uv run pyright src/ benchmarks/ --pythonversion 3.13

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13
      - name: Unit pack (no Postgres service)
        run: |
          mapfile -t paths < .github/ci/unit-paths.txt
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "unit-paths.txt is empty" >&2
            exit 1
          fi
          uv run pytest "${paths[@]}" -q --tb=short

  contract-smoke:
    name: Contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19 with required extensions
        run: .github/ci/start-postgres.sh
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13
      - name: Contract smoke pack
        run: |
          mapfile -t paths < .github/ci/contract-smoke-paths.txt
          uv run pytest "${paths[@]}" -v --tb=short

  integration-workers:
    name: Integration (workers)
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workers == 'true'
      || needs.changes.outputs.shared_core == 'true'
      || needs.changes.outputs.ci_control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19 with required extensions
        run: .github/ci/start-postgres.sh
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13
      - name: Workers + spine integration
        run: uv run pytest src/tests/workers src/tests/spine -q --tb=short

  integration-surfaces:
    name: Integration (surfaces)
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.surfaces == 'true'
      || needs.changes.outputs.shared_core == 'true'
      || needs.changes.outputs.ci_control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19 with required extensions
        run: .github/ci/start-postgres.sh
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13
      - name: Surfaces + eval integration
        run: uv run pytest src/tests/surfaces src/tests/eval -q --tb=short

  integration-adapters:
    name: Integration (adapters)
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.adapters == 'true'
      || needs.changes.outputs.shared_core == 'true'
      || needs.changes.outputs.ci_control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 19 with required extensions
        run: .github/ci/start-postgres.sh
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.13
      - name: Adapters + profiles + spikes integration
        run: |
          uv run pytest src/tests/adapters src/tests/profiles src/tests/spikes -q --tb=short

  compose-quickstart:
    name: Compose quickstart
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.compose == 'true'
      || needs.changes.outputs.ci_control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QUICKSTART_TARGET_SECONDS: "600"
      REMEMBERSTACK_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env as the quickstart documents
        run: |
          # .env.example ships no secrets; Compose must refuse it.
          if docker compose --env-file .env.example config --quiet; then
            echo "Compose accepted .env.example without secrets" >&2
            exit 1
          fi
          cp .env.example .env
          printf 'REMEMBERSTACK_POSTGRES_PASSWORD=%s\nREMEMBERSTACK_MINIO_ACCESS_KEY=%s\nREMEMBERSTACK_MINIO_SECRET_KEY=%s\nREMEMBERSTACK_SELFHOST_DEPLOYMENT_ID=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 12)" "$(openssl rand -hex 32)" \
            "$(openssl rand -hex 16 | sed -E 's/^(.{8})(.{4}).(.{3}).(.{3})(.{12})$/\1-\2-4\3-8\4-\5/')" >> .env

      - name: Validate Compose model
        run: |
          docker compose --env-file .env config --quiet
          docker compose --env-file .env config --format json | python3 -c \
            'import json,sys; ports=json.load(sys.stdin)["services"]["api"]["ports"]; assert [p["host_ip"] for p in ports] == ["127.0.0.1"], ports'

      - name: Prove every .env.example variable reaches the engine
        run: |
          # Set every variable .env.example names, commented or not, in a
          # scratch copy of .env, then check that Compose hands each one to
          # every engine service. The probe value is an address because one
          # of them (the API publish address) is interpolated into a port.
          cp .env .env.ci-original
          python3 - <<'PY'
          import re

          named = set(re.findall(r"^#?\s*([A-Z][A-Z0-9_]*)=", open(".env.example").read(), re.M))
          present = set(re.findall(r"^([A-Z][A-Z0-9_]*)=", open(".env").read(), re.M))
          with open(".env", "a") as env:
              env.writelines(f"{name}=127.0.0.1\n" for name in sorted(named - present))
          PY
          docker compose --env-file .env --profile operations --profile managed \
            config --format json > compose-config.json
          mv .env.ci-original .env
          python3 - <<'PY'
          import json
          import re

          named = set(re.findall(r"^#?\s*([A-Z][A-Z0-9_]*)=", open(".env.example").read(), re.M))
          services = json.load(open("compose-config.json"))["services"]
          engine = {
              name: spec for name, spec in services.items()
              if spec.get("image", "").startswith("ghcr.io/writeitai/remember-stack:")
          }
          assert {"setup", "api", "projections", "meter-receipts"} <= set(engine), sorted(engine)
          for name, spec in engine.items():
              missing = sorted(named - set(spec.get("environment", {})))
              assert not missing, (name, missing)
          print(f"{len(named)} variables reach {len(engine)} engine services")
          PY
          rm compose-config.json

      - name: Start fresh self-host deployment
        run: |
          started_at="$(date +%s)"
          docker compose --env-file .env up --build --detach --wait
          curl --fail http://localhost:8000/operations
          served_revision="$(curl --fail --silent http://localhost:8000/deployment \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["build_revision"])')"
          test "$served_revision" = "${REMEMBERSTACK_BUILD_REVISION}"
          query_result="$(curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"sql":"SELECT count(*) AS document_count FROM documents_live","parameters":[],"max_rows":1}' \
            http://localhost:8000/query/sql)"
          printf '%s' "$query_result" | python3 -c \
            'import json,sys; result=json.load(sys.stdin); assert result["termination_reason"] == "completed", result'
          elapsed_seconds="$(($(date +%s) - started_at))"
          echo "Quickstart cold start to first query: ${elapsed_seconds}s / ${QUICKSTART_TARGET_SECONDS}s target" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed_seconds" -le "$QUICKSTART_TARGET_SECONDS"

      - name: Prove object-store round trip and conditional create
        run: |
          docker compose --env-file .env exec -T api python - <<'PY'
          from uuid import uuid4

          from rememberstack.adapters.selfhost import MinIOObjectStore, MinIOSettings
          from rememberstack.model import ObjectAlreadyExistsError, ObjectKey
          from rememberstack.profiles.selfhost import SelfHostSettings

          profile = SelfHostSettings.model_validate({})
          s3 = MinIOSettings.model_validate({})
          # Each bucket is its own SeaweedFS collection and needs its own
          # volume slots on first write; all three must accept a write.
          for bucket in (
              profile.raw_bucket_name,
              profile.artifacts_bucket_name,
              profile.corpusfs_bucket_name,
          ):
              store = MinIOObjectStore(bucket=bucket, settings=s3)
              key = ObjectKey(f"ci/round-trip-{uuid4().hex}")
              content = f"round trip {bucket}".encode()
              store.write_bytes(key=key, content=content)
              if store.read_bytes(key=key) != content:
                  raise RuntimeError(f"{bucket} returned different bytes")
              print(f"{bucket}: write and read back ok")

          store = MinIOObjectStore(bucket=profile.raw_bucket_name, settings=s3)
          key = ObjectKey("ci/immutable-object")
          store.write_bytes(key=key, content=b"first")
          try:
              store.write_bytes(key=key, content=b"replacement")
          except ObjectAlreadyExistsError:
              pass
          else:
              raise RuntimeError("the object store replaced an immutable object key")
          PY

      - name: Prove the zero-cost full pipeline
        run: |
          running_services="$(
            docker compose --env-file .env ps --status running --services
          )"
          for service in \
            api worker-convert worker-structure worker-chunk worker-embed-chunk \
            worker-extract-claims worker-normalize-relations \
            worker-adjudicate-observations worker-adjudicate-supersession \
            worker-embed-claim worker-reconcile worker-label-relation; do
            printf '%s\n' "$running_services" | grep -qx "$service"
          done
          ingested="$(
            curl --fail --header 'Content-Type: application/octet-stream' \
              --data-binary ' ' \
              'http://localhost:8000/ingest?filename=empty.md&mime=text%2Fmarkdown'
          )"
          version_id="$(
            printf '%s' "$ingested" |
              docker compose --env-file .env exec -T api \
                python -c 'import json, sys; print(json.load(sys.stdin)["version_id"])'
          )"
          # D84/D88/D90: extract is chunk-scoped; empty input skips claim
          # normalize and takes durable empty_complete (no document_version
          # adjudicate_observations row at the entity-fanout generation).
          # Version-level ledger stages:
          # convert→structure→chunk→embed_chunk→adjudicate_supersession→
          # embed_claim→label→reconcile (8).
          observed=''
          for attempt in {1..60}; do
            observed="$(docker compose --env-file .env exec -T postgres \
              psql -U rememberstack -d rememberstack -Atc \
              "SELECT count(*), count(*) FILTER (WHERE status='succeeded'), count(DISTINCT stage) FROM processing_state WHERE target_id='$version_id'")"
            if [ "$observed" = '8|8|8' ]; then
              break
            fi
            sleep 1
          done
          test "$observed" = '8|8|8'
          test "$(docker compose --env-file .env exec -T postgres \
            psql -U rememberstack -d rememberstack -Atc \
            'SELECT count(*) FROM cost_ledger')" = '0'
          docker compose --env-file .env --profile operations \
            run --rm projections
          readiness="$(
            curl --fail --header 'Content-Type: application/json' \
              --data "{\"version_ids\":[\"$version_id\"],\"require\":{\"pipeline\":true,\"p1\":true,\"live_graph\":true,\"p3\":true}}" \
              'http://localhost:8000/readiness'
          )"
          printf '%s' "$readiness" |
            docker compose --env-file .env exec -T api python -c \
              'import json, sys; report = json.load(sys.stdin); assert report["ready"]; assert all(item["ready"] for item in report["versions"]); assert all(item["ready"] for item in report["capabilities"].values())'

      - name: Back up, destroy and restore as the upgrades page documents
        run: |
          # The commands between the markers are the ones on
          # website/src/app/docs/self-hosting/upgrades/page.mdx; keep them equal.
          psql_count() {
            docker compose --env-file .env exec -T postgres \
              psql -U rememberstack -d rememberstack -Atc "$1"
          }
          # Through the restricted SQL role: proves its grants and password.
          sql_count() {
            curl --fail --silent \
              --header 'Content-Type: application/json' \
              --data '{"sql":"SELECT count(*) AS n FROM documents_live","parameters":[],"max_rows":1}' \
              http://localhost:8000/query/sql \
              | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["termination_reason"] == "completed", r; print(r["rows"][0][0])'
          }
          before="$(psql_count 'SELECT (SELECT count(*) FROM document_versions), (SELECT count(*) FROM processing_state), (SELECT version_num FROM alembic_version)')"
          sql_before="$(sql_count)"

          # --- back up
          docker compose stop
          docker compose up -d --wait postgres object-store
          mkdir -p backup
          docker compose exec -T postgres sh -c \
            'pg_dumpall -U "$POSTGRES_USER" --roles-only --no-role-passwords' > backup/roles.sql
          docker compose exec -T postgres sh -c \
            'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --format=custom' > backup/database.dump
          docker compose --profile backup run --rm -T rclone sync store: /backup/objects
          docker compose up -d --wait
          # --- end back up

          test -s backup/database.dump
          find backup/objects -type f | grep -q .
          docker compose --env-file .env down --volumes

          # --- restore
          docker compose up -d --wait postgres object-store
          docker compose exec -T postgres sh -c \
            'grep -v "^CREATE ROLE $POSTGRES_USER;$" | psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d postgres' < backup/roles.sql
          docker compose exec -T postgres sh -c \
            'dropdb -U "$POSTGRES_USER" --force "$POSTGRES_DB" && pg_restore -U "$POSTGRES_USER" -d postgres --create --exit-on-error' < backup/database.dump
          docker compose --profile backup run --rm -T rclone copy /backup/objects store:
          docker compose up -d --wait
          # --- end restore

          after="$(psql_count 'SELECT (SELECT count(*) FROM document_versions), (SELECT count(*) FROM processing_state), (SELECT version_num FROM alembic_version)')"
          test "$before" = "$after"
          test "$(sql_count)" = "$sql_before"
          # The database-level grant narrowing came back with the dump.
          test "$(psql_count "SELECT has_database_privilege('public', current_database(), 'CONNECT')")" = 'f'
          # The filesystem snapshot the database points at came back with the objects.
          docker compose --env-file .env run --rm --no-deps -T api mounts --root /tmp/views
          docker compose --env-file .env exec -T api remember ops graph-catalog ensure \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["ready"]'
          sudo rm -rf backup

      - name: Stage an upgrade from the prior schema
        run: |
          docker compose --env-file .env stop \
            api worker-convert worker-structure worker-chunk worker-embed-chunk \
            worker-extract-claims worker-normalize-relations \
            worker-adjudicate-observations worker-adjudicate-supersession \
            worker-embed-claim worker-reconcile worker-label-relation
          # Build an empty pre-D119 fixture. Temporal/span migrations refuse
          # lossy conversion or downgrade of populated stores.
          docker compose --env-file .env run --rm --no-deps -T \
            --volume "$PWD/src/tests/database_reset.py:/tmp/database_reset.py:ro" \
            --env PYTHONPATH=/tmp --entrypoint python setup - <<'PY'
          from alembic import command
          from alembic.config import Config
          from sqlalchemy import create_engine, text
          from rememberstack.model import DeploymentBootstrapInput
          from rememberstack.spine import DeploymentBootstrapper
          from rememberstack.spine.settings import load_database_settings
          from database_reset import reset_database

          database_url = load_database_settings().sqlalchemy_url()
          engine = create_engine(database_url)
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT deployment_id,slug,name,description,default_language,"
                  "raw_bucket,artifacts_bucket,corpusfs_bucket,knowledge_repo_uri "
                  "FROM deployments"
              )).mappings().one()
              deployment = DeploymentBootstrapInput.model_validate(dict(row))
          engine.dispose()
          config = Config("alembic.ini")
          config.set_main_option("sqlalchemy.url", database_url)
          reset_database(config=config)
          command.upgrade(config=config, revision="p9_31_0052")
          engine = create_engine(database_url)
          DeploymentBootstrapper(engine=engine).bootstrap_deployment(
              deployment_input=deployment
          )
          engine.dispose()
          PY
          test "$(docker compose --env-file .env exec -T postgres \
            psql -U rememberstack -d rememberstack -Atc \
            'SELECT version_num FROM alembic_version')" = 'p9_31_0052'
          test "$(docker compose --env-file .env exec -T postgres \
            psql -U rememberstack -d rememberstack -Atc \
            'SELECT count(*) FROM deployments')" = '1'
          docker compose --env-file .env rm --force setup

      - name: Run migrations before application processes restart
        run: |
          compose_args=(
            --env-file .env
            --file compose.yaml
            --file .github/compose/upgrade-gate.yaml
          )
          docker compose "${compose_args[@]}" up --detach --wait &
          compose_pid="$!"
          release_gate() {
            docker compose "${compose_args[@]}" exec -T setup \
              touch /tmp/rememberstack-upgrade-release
          }
          trap 'release_gate || true' EXIT

          setup_running=''
          for attempt in {1..30}; do
            setup_running="$(
              docker compose "${compose_args[@]}" ps --status running --services setup
            )"
            if [ "$setup_running" = 'setup' ]; then
              break
            fi
            sleep 1
          done
          test "$setup_running" = 'setup'

          running_services="$(
            docker compose "${compose_args[@]}" ps --status running --services
          )"
          test -z "$(printf '%s\n' "$running_services" \
            | grep -E '^(api|worker-(convert|structure|chunk|embed-chunk|extract-claims|normalize-relations|adjudicate-observations|adjudicate-supersession|embed-claim|reconcile|label-relation))$' || true)"
          test "$(docker compose "${compose_args[@]}" exec -T postgres \
            psql -U rememberstack -d rememberstack -Atc \
            'SELECT version_num FROM alembic_version')" = 'p9_31_0052'

          release_gate
          wait "$compose_pid"
          trap - EXIT
          test "$(docker compose --env-file .env exec -T postgres \
            psql -U rememberstack -d rememberstack -Atc \
            'SELECT version_num FROM alembic_version')" = 'p9_36_0057'
          test "$(docker compose --env-file .env exec -T postgres \
            psql -U rememberstack -d rememberstack -Atc \
            'SELECT count(*) FROM deployments')" = '1'
          running_services="$(
            docker compose "${compose_args[@]}" ps --status running --services
          )"
          for service in \
            api worker-convert worker-structure worker-chunk worker-embed-chunk \
            worker-extract-claims worker-normalize-relations \
            worker-adjudicate-observations worker-adjudicate-supersession \
            worker-embed-claim worker-reconcile worker-label-relation; do
            printf '%s\n' "$running_services" | grep -qx "$service"
          done
          curl --fail http://localhost:8000/healthz

      - name: Show service logs after failure
        if: failure()
        run: docker compose --env-file .env logs --no-color

      - name: Remove quickstart deployment
        if: always()
        run: docker compose --env-file .env down --volumes

  # The release publishes the engine image for linux/amd64 and linux/arm64.
  # Build the arm64 half natively here, so a dependency without an arm64 build
  # fails on its pull request rather than in the release.
  engine-image-arm64:
    name: Engine image (linux/arm64)
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.compose == 'true'
      || needs.changes.outputs.ci_control == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the engine image
        run: docker build --tag remember-stack:arm64-check .

      - name: The image is arm64 and its native dependencies load
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' remember-stack:arm64-check)" = arm64
          docker run --rm --entrypoint python remember-stack:arm64-check -c \
            'import onnxruntime, pglast, PIL, psycopg, pyarrow; import rememberstack.profiles.selfhost; print("ok")'
          docker run --rm --entrypoint remember remember-stack:arm64-check --version

  # Single always-present required check. Integration path jobs are soft.
  pr-gate:
    name: PR gate
    runs-on: ubuntu-latest
    needs: [changes, quality, unit, contract-smoke, engine-image-arm64]
    if: always()
    steps:
      - name: Require hard lanes (incl. path selector)
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "quality=${{ needs.quality.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "contract-smoke=${{ needs.contract-smoke.result }}"
          echo "engine-image-arm64=${{ needs.engine-image-arm64.result }}"
          test "${{ needs.changes.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.contract-smoke.result }}" = "success"
          # Path-selected: skipped when no image input changed, but a run
          # that happened must have passed.
          case "${{ needs.engine-image-arm64.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
