name: Nightly CI

# Full multi-Python suite + coverage. Not required for PR merge.
# See design/operations/pr-ci-fast-gate.md

on:
  schedule:
    # 05:17 UTC daily — offset from hour to avoid schedule storms
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  compose-quickstart:
    name: Compose quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QUICKSTART_TARGET_SECONDS: "600"
      REMEMBERSTACK_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet
      - name: Start fresh self-host deployment
        run: |
          started_at="$(date +%s)"
          docker compose --env-file .env.example up --build --detach --wait
          curl --fail http://localhost:8000/recipes
          served_revision="$(curl --fail --silent http://localhost:8000/deployment \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["build_revision"])')"
          test "$served_revision" = "${REMEMBERSTACK_BUILD_REVISION}"
          elapsed_seconds="$(($(date +%s) - started_at))"
          echo "Quickstart cold start to first query: ${elapsed_seconds}s / ${QUICKSTART_TARGET_SECONDS}s target" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          test "$elapsed_seconds" -le "$QUICKSTART_TARGET_SECONDS"
      - name: Remove quickstart deployment
        if: always()
        run: docker compose --env-file .env.example down --volumes

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: ghcr.io/dbsystel/postgresql-partman@sha256:bf9d2331aaeb3e33a4e6e73b4c024ca618d4d1ea050bbab978125ff63b83385a
        env:
          POSTGRES_USER: rememberstack
          POSTGRES_PASSWORD: rememberstack_test
          POSTGRES_DB: rememberstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rememberstack -d rememberstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Architecture dependency check
        run: uv run lint-imports
      - name: Ruff lint
        run: uv run ruff check src/ benchmarks/
      - name: Ruff format check
        run: uv run ruff format --check src/ benchmarks/
      - name: Pyright type check
        run: uv run pyright src/ benchmarks/ --pythonversion ${{ matrix.python-version }}
      - name: Real PostgreSQL Alembic lifecycle
        run: uv run pytest src/tests/spine/test_migrations.py -v --tb=short
      - name: Full tests (with coverage)
        run: uv run pytest src/tests -v --tb=short --cov --cov-report=term
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nightly-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-nightly-*
          merge-multiple: true
      - name: Coverage comment + badge
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
