name: Prepare next release

on:
  push:
    branches: [main]
    paths-ignore: [pyproject.toml]
  workflow_dispatch:
  repository_dispatch:
    types: [release-completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: remember-stack-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Refresh patch release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: packages/typescript-client/package-lock.json
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.REMEMBER_RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.REMEMBER_RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
      - name: Prepare the next version only after the current version is released
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(python scripts/check_release_contract.py --print-version)"
          git fetch --force --tags origin
          if ! git rev-parse --verify --quiet "refs/tags/v${current}" >/dev/null; then
            echo "Current v${current} is awaiting publication; no later version is prepared."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(python scripts/check_unreleased_changes.py --tag "v${current}")" = false ]; then
            echo "No commits followed v${current}; no later version is prepared."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next="$(python scripts/prepare_next_release.py)"
          uv lock
          uv lock --check
          uv run python scripts/export_openapi.py -o openapi.json
          python scripts/generate_docs_llms.py
          # The TypeScript client pins the OpenAPI hash and package version.
          uv run python scripts/export_typescript_contracts.py
          (cd packages/typescript-client && node scripts/npm.mjs ci && node scripts/generate.mjs)
          python scripts/check_release_contract.py --tag "v${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit the deterministic release coordinates
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch=automation/next-release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          gh auth setup-git
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git checkout -B "$branch"
          git add pyproject.toml uv.lock compose.yaml README.md openapi.json website/ \
            packages/typescript-client/contracts packages/typescript-client/src
          git commit -m "chore(release): prepare v${VERSION}"
          git push --force-with-lease origin "HEAD:${branch}"
          # A release needs human steps the bot cannot do, so it only opens
          # the PR; merging it starts the Release workflow (release.yml).
          body="Automated release-coordinate bump to v${VERSION} from protected main. Before merging (merging starts the Release workflow): add the changelog entry, re-check the PostgreSQL pins (RELEASING.md), run check_release_contract.py --tag v${VERSION}, and get a Codex review. This branch is force-pushed on every main push, so finish the release on your own branch from it and close this PR."
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Prepare v${VERSION}" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Prepare v${VERSION}" --body "$body"
          fi
