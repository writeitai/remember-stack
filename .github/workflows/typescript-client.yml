name: TypeScript client
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: typescript-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    name: SDK (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.0.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript-client/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.6'
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --python 3.13
      - name: Install locked SDK dependencies
        working-directory: packages/typescript-client
        run: npm ci
      - name: Check offline API, inventory, schemas and generated artifacts
        working-directory: packages/typescript-client
        run: npm run check:generated
      - name: Check executable Python behavior recordings
        working-directory: packages/typescript-client
        run: npm run check:parity
      - name: Typecheck and run API/wire/security/HTTP/HTTPS tests
        working-directory: packages/typescript-client
        run: npm run typecheck && npm test
      - name: Verify packed ESM and CommonJS consumers
        working-directory: packages/typescript-client
        run: npm run check:package
