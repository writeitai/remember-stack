name: Release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact previously selected main commit to resume
        required: true

concurrency:
  group: remember-stack-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve immutable main release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - id: release
        name: Bind the version to this main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          source_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" FETCH_HEAD
          version="$(python scripts/check_release_contract.py --print-version)"
          tag="v${version}"
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged="$(git rev-list -n 1 "${tag}")"
            if [ "${tagged}" != "$source_sha" ]; then
              echo "::error::${tag} already binds a different immutable commit"
              exit 1
            fi
            publish=false
          else
            publish=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # This job runs the WHOLE suite in one process, so its budget must exceed the
    # sum of CI's split integration jobs — not match any one of them. CI alone
    # budgets 45 minutes for workers and 50 for surfaces. At 30 minutes this job
    # was killed mid-run (reported as "cancelled", with pytest terminated as an
    # orphan process), which silently made the release unpublishable: verify can
    # never pass, so publish-pypi and publish-ghcr never run.
    timeout-minutes: 90
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Release commit is current main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ needs.prepare.outputs.source_sha }}" FETCH_HEAD; then
            echo "::error::release commit is not on main"
            exit 1
          fi
          echo "${{ needs.prepare.outputs.source_sha }} is on main"

      - name: Start PostgreSQL 19 with required extensions
        run: .github/ci/start-postgres.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --python 3.14

      - name: Validate tag and shared artifact version
        run: uv run python scripts/check_release_contract.py --tag "${{ needs.prepare.outputs.tag }}"

      - name: Verify architecture, style, and types
        run: |
          uv run lint-imports
          uv run ruff check src/ benchmarks/
          uv run ruff format --check src/ benchmarks/
          uv run pyright src/ benchmarks/ --pythonversion 3.14

      - name: Run the release test suite
        run: uv run pytest src/tests -q

      - name: Build distributions
        run: |
          uv build
          # The terminal deprecation transition package 'rememberstack' is published exactly once on v0.17.0
          if [ "${{ needs.prepare.outputs.tag }}" = "v0.17.0" ]; then
            uv build packages/rememberstack --out-dir dist
          fi

      - name: Record distribution checksums
        run: |
          cd dist
          sha256sum -- * | tee "${RUNNER_TEMP}/dist.sha256"

      - name: Metadata renders on PyPI
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Smoke test built distributions in clean venv
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            echo "::group::${dist}"
            venv="$(mktemp -d)/venv"
            uv venv "${venv}"
            uv pip install --find-links dist --python "${venv}/bin/python" "${dist}"
            "${venv}/bin/python" -c "import remember; assert hasattr(remember, 'Client'); assert hasattr(remember, 'MemoryClient')"
            "${venv}/bin/remember" --version
            if [ -f "${venv}/bin/rememberstack" ]; then
              "${venv}/bin/rememberstack" --version
            fi
            if [ -f "${venv}/bin/remember-status" ]; then
              "${venv}/bin/remember-status" --help > /dev/null
            fi
            echo "::endgroup::"
          done

      - name: Distributions are unchanged since build
        run: |
          cd dist
          if ! sha256sum --check --strict "${RUNNER_TEMP}/dist.sha256"; then
            echo "::error::a distribution changed after it was built and verified"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/remember
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Refuse a conflicting existing PyPI version
        id: existing
        run: |
          state="$(python scripts/check_pypi_release.py --project remember --version '${{ needs.prepare.outputs.version }}' --dist dist)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Publish through PyPI Trusted Publishing
        if: steps.existing.outputs.state == 'missing'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.12.4
        with:
          skip-existing: true


  publish-ghcr:
    name: Publish GHCR
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the semantic image tag
        id: metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/writeitai/remember-stack
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Preserve an existing immutable image tag on recovery
        id: existing
        env:
          IMAGE: ghcr.io/writeitai/remember-stack:${{ needs.prepare.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull --platform linux/amd64 "$IMAGE" >/dev/null
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "${{ needs.prepare.outputs.source_sha }}"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish the shared API/worker image
        if: steps.existing.outputs.present != 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          annotations: org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          build-args: |
            REMEMBERSTACK_BUILD_REVISION=${{ needs.prepare.outputs.source_sha }}


  publish-postgres-ghcr:
    name: Publish multi-architecture PostgreSQL foundation
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4480b82837b51a6a34a65b0cfa14 # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514310cf821e50f8fce2cf61da37718ccd58 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the immutable foundation tag
        id: metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/writeitai/remember-stack-postgres
          flavor: latest=false
          tags: type=raw,value=19beta3-${{ needs.prepare.outputs.version }}

      - name: Preserve an existing immutable foundation tag on recovery
        id: existing
        env:
          IMAGE: ghcr.io/writeitai/remember-stack-postgres:19beta3-${{ needs.prepare.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull --platform linux/amd64 "$IMAGE" >/dev/null
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "${{ needs.prepare.outputs.source_sha }}"
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish both supported architectures
        id: build
        if: steps.existing.outputs.present != 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile.postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          annotations: org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}

      - name: Record manifest and per-architecture digests
        env:
          POSTGRES_IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          POSTGRES_MANIFEST_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-evidence
          image_coordinate="${POSTGRES_IMAGE_TAG}"
          if [ -z "${POSTGRES_MANIFEST_DIGEST}" ]; then
            POSTGRES_MANIFEST_DIGEST="$(docker buildx imagetools inspect "${POSTGRES_IMAGE_TAG}" | awk '/^Digest:/ {print $2; exit}')"
          fi
          test -n "${POSTGRES_MANIFEST_DIGEST}"
          image_coordinate="${image_coordinate}@${POSTGRES_MANIFEST_DIGEST}"
          docker buildx imagetools inspect --raw "${image_coordinate}" \
            | jq --arg image "${POSTGRES_IMAGE_TAG}" \
                 --arg manifest "${POSTGRES_MANIFEST_DIGEST}" \
                 '{image: $image, manifest_digest: $manifest,
                   platforms: [.manifests[] |
                     {os: .platform.os, architecture: .platform.architecture,
                      digest: .digest}]}' \
            > release-evidence/postgres-image-digests.json
          jq -e '
            [.platforms[] | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          ' release-evidence/postgres-image-digests.json

      - name: Upload immutable PostgreSQL image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: postgres-image-evidence
          path: release-evidence/postgres-image-digests.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [prepare, publish-pypi, publish-ghcr, publish-postgres-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Download PostgreSQL image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: postgres-image-evidence
          path: release-evidence/

      # Asset names here are not always the names published. GitHub prefixes a
      # dotfile with "default", so `.env.example` below is downloadable as
      # `default.env.example` and by no other name. A consumer pinning the
      # source name gets a 404, which is exactly what happened: four fleet
      # engine pins recorded `.env.example`, copied forward from the first,
      # because they were written from this list rather than from a release.
      # Check the published asset names, not this block, when pinning.
      - name: Create the release with pinned deployment inputs
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          generate_release_notes: true
          files: |
            dist/*
            release-evidence/postgres-image-digests.json
            compose.yaml
            .env.example
            openapi.json
      - name: Revisit main changes that arrived during publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST repos/${{ github.repository }}/dispatches
          -f event_type=release-completed
