name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    # This job runs the WHOLE suite in one process, so its budget must exceed the
    # sum of CI's split integration jobs — not match any one of them. CI alone
    # budgets 45 minutes for workers and 50 for surfaces. At 30 minutes this job
    # was killed mid-run (reported as "cancelled", with pytest terminated as an
    # orphan process), which silently made the release unpublishable: verify can
    # never pass, so publish-pypi and publish-ghcr never run.
    timeout-minutes: 90
    env:
      REMEMBERSTACK_DATABASE_URL: postgresql+psycopg://rememberstack:rememberstack_test@localhost:5432/rememberstack_test
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 19 with required extensions
        run: .github/ci/start-postgres.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --python 3.14

      - name: Validate tag and shared artifact version
        run: uv run python scripts/check_release_contract.py --tag "$GITHUB_REF_NAME"

      - name: Verify architecture, style, and types
        run: |
          uv run lint-imports
          uv run ruff check src/ benchmarks/
          uv run ruff format --check src/ benchmarks/
          uv run pyright src/ benchmarks/ --pythonversion 3.14

      - name: Run the release test suite
        run: uv run pytest src/tests -q

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rememberstack
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-ghcr:
    name: Publish GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the semantic image tag
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/writeitai/remember-stack
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - name: Build and publish the shared API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            REMEMBERSTACK_BUILD_REVISION=${{ github.sha }}

  publish-postgres-ghcr:
    name: Publish multi-architecture PostgreSQL foundation
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the immutable foundation tag
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/writeitai/remember-stack-postgres
          flavor: latest=false
          tags: type=semver,pattern=19beta3-{{version}}

      - name: Build and publish both supported architectures
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Record manifest and per-architecture digests
        env:
          POSTGRES_IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          POSTGRES_MANIFEST_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-evidence
          image_coordinate="${POSTGRES_IMAGE_TAG}@${POSTGRES_MANIFEST_DIGEST}"
          docker buildx imagetools inspect --raw "${image_coordinate}" \
            | jq --arg image "${POSTGRES_IMAGE_TAG}" \
                 --arg manifest "${POSTGRES_MANIFEST_DIGEST}" \
                 '{image: $image, manifest_digest: $manifest,
                   platforms: [.manifests[] |
                     {os: .platform.os, architecture: .platform.architecture,
                      digest: .digest}]}' \
            > release-evidence/postgres-image-digests.json
          jq -e '
            [.platforms[] | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          ' release-evidence/postgres-image-digests.json

      - name: Upload immutable PostgreSQL image evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-image-evidence
          path: release-evidence/postgres-image-digests.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [publish-pypi, publish-ghcr, publish-postgres-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Download PostgreSQL image evidence
        uses: actions/download-artifact@v4
        with:
          name: postgres-image-evidence
          path: release-evidence/

      - name: Create the release with pinned deployment inputs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-evidence/postgres-image-digests.json
            compose.yaml
            .env.example
