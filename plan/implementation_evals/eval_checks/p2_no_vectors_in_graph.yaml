schema_version: 1
id: p2_no_vectors_in_graph
type: harness_judge
description: The graph holds no embeddings or FTS; PostgreSQL-native P1 stores derived relation-label vectors on the natural relation rows.
tags: [p2, p1, D8, D94]
instructions: |
  You are judging whether this repository's IMPLEMENTATION honors a binding design invariant.
  Read plan/designs/p2_graph_design.md — the binding source — and decisions.md D8 for rationale and
  refinement history, then inspect the P2 snapshot contents and PostgreSQL P1 definitions
  under src/. These are acceptance checks for the FINAL system: if the subsystem is absent or
  partial, score 0.

  Verify ALL of the following:
  1. No vector index, no embedding column, and no FTS index exists in the LadybugDB snapshot.
  2. Each relation's canonical fact label and disposable P1 embedding are co-located on the
     natural PostgreSQL relation row; no relation-search mirror table exists.
  3. The retrieval flow ranks relation ids through PostgreSQL P1 and may then expand those ids
     in the graph; semantic search does not run inside LadybugDB.

  Source precedence: the design docs under plan/designs/ are the binding statement of the
  current system; the decision log is its indexed record — read cited decisions together
  with their refinement/withdrawal annotations. If sources appear to disagree, treat the
  design docs (including postgres_schema_design.md) as controlling, and note the
  discrepancy in your reason rather than failing an implementation that follows the
  current design.

  Score 1 only if EVERY condition demonstrably holds — cite file paths in your reason.
  Otherwise score 0.
